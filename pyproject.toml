[project]
name = "yaharness"
version = "0.1.0"
description = "A clean reference implementation of a ReAct agent harness with SWE-bench grading"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "George Punter" }]
license = { text = "MIT" }
keywords = ["agent", "react", "llm", "swebench", "gaia", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.27.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pypdf>=6.12.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "selectolax>=0.4.9",
    "swebench>=4.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.14",
]

[project.scripts]
yabench = "yaharness.cli.run_benchmark:_entry"
yareport = "yaharness.cli.report:_entry"
yagrade = "yaharness.cli.grade_swebench:_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaharness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl", "selectolax", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/yaharness"]
omit = ["tests/*"]
